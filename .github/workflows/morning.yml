name: NSE morning board

on:
  schedule:
    - cron: "30 3 * * 1-5"       # 9:00 IST: intraday news + daily scan + F&O shortlist
    - cron: "45,50,55 3 * * 1-5" # 9:15 to 9:25 IST, every 5 min: prices, news (tick)
    - cron: "*/5 4-9 * * 1-5"    # 9:30 to 15:25 IST, every 5 min: intraday plans and options, prices, entries,
                                 # exits, news, levels crossed (tick)
    - cron: "20 10 * * 1-5"      # 15:50 IST: swing end-of-day scan, track record, sheet
    - cron: "30 4 * * 6"         # Saturday 10:00 IST: refresh every liquid stock's fundamentals
  workflow_dispatch:
    inputs:
      stage:
        description: "pre, orb, all, refresh (the Update now button), tick (the 5-minute run), swing-eod, swing-live, swing-options, swing-fundamentals, or check (Upstox token health, no commit)"
        default: "all"
      request:
        description: "id the dashboard uses to find its own run (leave empty)"
        default: ""

run-name: "NSE board ${{ github.event.inputs.stage || 'scheduled' }} ${{ github.event.inputs.request }}"

permissions:
  contents: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # optional: Upstox Analytics Token (read-only). Without it, or if Upstox refuses it, Yahoo is used.
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      # optional: the Google Sheet. Without both, the sheet is skipped.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the stage
        id: stage
        run: |
          case "${{ github.event.schedule }}" in
            "30 3 * * 1-5") s=pre ;;
            "45,50,55 3 * * 1-5"|"*/5 4-9 * * 1-5") s=tick ;;
            "20 10 * * 1-5") s=swing-eod ;;
            "30 4 * * 6") s=swing-fundamentals ;;
            *) s="${{ github.event.inputs.stage }}" ;;
          esac
          echo "stage=${s:-all}" >> "$GITHUB_OUTPUT"

      - name: Install the Google Sheets client
        if: env.SHEET_ID != '' && steps.stage.outputs.stage != 'check'
        run: pip install --quiet google-auth requests

      - name: Refresh the NSE list (Mondays, keeps the old one if NSE refuses)
        if: steps.stage.outputs.stage == 'pre'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "1" ]; then python nse/universe.py || echo "universe refresh skipped"; fi

      - name: Check Upstox
        if: steps.stage.outputs.stage == 'check'
        run: python nse/check_upstox.py

      - name: Run
        if: steps.stage.outputs.stage != 'check'
        run: |
          case "${{ steps.stage.outputs.stage }}" in
            swing-*) python nse/swing.py "${{ steps.stage.outputs.stage }}" ;;
            refresh) python nse/morning.py refresh; python nse/swing.py live ;;
            tick)
              # the opening-range plans while entries are allowed, then everything else
              hm=$(TZ=Asia/Kolkata date +%-H%M)
              if [ "$hm" -ge 935 ] && [ "$hm" -le 1450 ]; then python nse/morning.py orb || echo "intraday plans skipped"; fi
              python nse/swing.py live ;;
            *) python nse/morning.py "${{ steps.stage.outputs.stage }}" ;;
          esac

      - name: Save the dashboard
        if: steps.stage.outputs.stage != 'check'
        run: |
          git config user.name "nse-morning"
          git config user.email "nse-morning@users.noreply.github.com"
          git add docs trader
          git diff --cached --quiet || git commit -m "NSE board $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST (${{ steps.stage.outputs.stage }})"
          git push
