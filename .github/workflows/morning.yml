name: NSE morning board

on:
  schedule:
    - cron: "30 3 * * 1-5"   # 9:00 IST: news + daily scan + shortlist
    - cron: "5 4 * * 1-5"    # 9:35 IST: opening range + trade numbers
  workflow_dispatch:
    inputs:
      stage:
        description: "pre, orb, all or refresh (the dashboard's Refresh button sends refresh)"
        default: "all"
      request:
        description: "id the dashboard uses to find its own run (leave empty)"
        default: ""

run-name: "NSE board ${{ github.event.inputs.stage || 'scheduled' }} ${{ github.event.inputs.request }}"

permissions:
  contents: write

concurrency:
  group: morning
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick the stage
        id: stage
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then s="${{ github.event.inputs.stage }}";
          elif [ "${{ github.event.schedule }}" = "30 3 * * 1-5" ]; then s=pre; else s=orb; fi
          echo "stage=$s" >> "$GITHUB_OUTPUT"

      - name: Refresh the NSE list (Mondays, keeps the old one if NSE refuses)
        if: steps.stage.outputs.stage == 'pre'
        run: |
          if [ "$(TZ=Asia/Kolkata date +%u)" = "1" ]; then python nse/universe.py || echo "universe refresh skipped"; fi

      - name: Run
        env:
          # optional: Upstox Analytics Token (read-only). Without it, or if Upstox refuses it, Yahoo is used.
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
        run: python nse/morning.py ${{ steps.stage.outputs.stage }}

      - name: Save the dashboard
        run: |
          git config user.name "nse-morning"
          git config user.email "nse-morning@users.noreply.github.com"
          git add docs trader
          git diff --cached --quiet || git commit -m "NSE board $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST (${{ steps.stage.outputs.stage }})"
          git push
